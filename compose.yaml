# WebPilot AI: web + worker. MongoDB lives in the cloud (MongoDB Atlas, set MONGO_URI in .env) and Redis is your existing
# container (not defined here). For a local MongoDB container instead, see compose.local-mongo.yaml.
# Before the first `docker compose up`, inspect your VPS (`docker network ls`, `docker ps`) and set
# REDIS_NETWORK / REDIS_HOST in .env to the real names.
name: webpilot

x-app: &app
  image: webpilot-ai:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  web:
    <<: *app
    container_name: webpilot-web
    security_opt: ["no-new-privileges:true"]
    ports:
      # Dashboard: http://<server-ip>:${APP_PORT} (default 8051; same number on the host and in the container).
      # Use BIND_ADDRESS=127.0.0.1 in .env to expose it only to the server itself (SSH tunnel).
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8051}:${APP_PORT:-8051}"
    volumes:
      - artifacts:/app/artifacts:ro     # the dashboard only reads screenshots
    networks: [redis]
    mem_limit: 768m

  worker:
    <<: *app
    container_name: webpilot-worker
    command: ["sh", "-c", "exec celery -A celery_app.celery worker -n webpilot@%h -Q ${CELERY_QUEUE:-webpilot} -c ${MAX_CONCURRENT_BROWSER_TASKS:-1} --prefetch-multiplier=1 -l ${LOG_LEVEL:-INFO}"]
    # Microsoft's Playwright seccomp profile lets Chromium keep its sandbox on without --no-sandbox.
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/seccomp_chromium.json
    shm_size: "1gb"                     # Chromium needs a large /dev/shm
    volumes:
      - artifacts:/app/artifacts
    networks: [redis]
    mem_limit: ${WORKER_MEM_LIMIT:-3g}  # Chromium + PaddleOCR are hungry; tune after measuring (docker stats)
    cpus: ${WORKER_CPUS:-2}
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py", "worker"]
      interval: 60s
      timeout: 20s
      start_period: 90s
      retries: 3

networks:
  redis:
    external: true
    name: ${REDIS_NETWORK:?set REDIS_NETWORK in .env (the Docker network your Redis container is on)}

volumes:
  artifacts:
    name: webpilot_artifacts
